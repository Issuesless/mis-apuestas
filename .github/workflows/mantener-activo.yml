name: Mantener activa la base de datos

# Supabase pausa los proyectos gratuitos con poca actividad durante 7 días.
# Una petición a la semana evita que se pause aunque pases días sin abrir la web.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hacer una petición a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/settings?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Respuesta de la base de datos: HTTP $code"
